[pytest]
testpaths = tests
norecursedirs = archive .git __pycache__ .venv node_modules
pythonpath = .
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# ТЗ-RESTRUCTURE (D6): subsystem markers for targeted runs.
# Usage: pytest -m kernel | pytest -m "federation or integration" | pytest -m "not slow"
markers =
    kernel: cognitive kernel + self-evolution + memory evolution
    contracts: contracts layer + contract-only specs
    services: services layer (agent/model/eval/workflow/plugin/scheduler)
    adapters: adapter layer (K6)
    federation: federation / distributed runtime / multi-hop routing / node discovery
    architecture: architecture gate (positive + negative)
    agent: agent platform / orchestration / autonomy
    graph: knowledge graph / semantic search
    llm: LLM adapter / advisor / transport
    security: security / sandbox / policy / trust
    observability: observability / runtime / supervisor / reflection / eventbus
    memory: memory / learning / procedural stores
    integration: integration / e2e / cli / assembly
    common: shared helpers + cross-layer fixtures
    k8: K8 negative/edge tests (gate proof-of-fire)
    slow: long-running / network / TCP tests
