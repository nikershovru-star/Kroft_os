<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>KnowledgeOS</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    #search { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    #suggestions { margin: 8px 0; color: #666; }
    #suggestions span { cursor: pointer; margin-right: 12px; text-decoration: underline; }
    .result { padding: 12px; border-bottom: 1px solid #eee; }
    .result b { display: block; margin-bottom: 4px; }
    #graph { width: 100%; height: 500px; border: 1px solid #ddd; margin-top: 20px; border-radius: 4px; }
    button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>KnowledgeOS</h1>
  <input id="search" type="text" placeholder="Search vault..." autocomplete="off">
  <div id="suggestions"></div>
  <div id="results"></div>
  <button onclick="loadGraph()">Show Graph</button>
  <button onclick="loadAnalytics()">Analytics</button>
  <div id="graph"></div>
  <div id="analytics"></div>

  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script>
    const API = "/api";
    const searchBox = document.getElementById("search");
    const suggestions = document.getElementById("suggestions");

    async function doSearch(q) {
      const [searchRes, suggestRes] = await Promise.all([
        fetch(`${API}/search?q=${encodeURIComponent(q)}`).then(r => r.json()),
        fetch(`${API}/suggest?prefix=${encodeURIComponent(q)}`).then(r => r.json()),
      ]);
      document.getElementById("results").innerHTML = searchRes.map(id =>
        `<div class="result"><b>${escapeHtml(id)}</b></div>`
      ).join("");
      suggestions.innerHTML = suggestRes.map(s =>
        `<span onclick="searchBox.value=${JSON.stringify(s).replace(/"/g, '&quot;')};doSearch(${JSON.stringify(s)});">${escapeHtml(s)}</span>`
      ).join("");
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => (
        {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]
      ));
    }

    searchBox.addEventListener("input", (e) => doSearch(e.target.value));

    async function loadGraph() {
      const data = await fetch(`${API}/graph`).then(r => r.json());
      const nodes = new vis.DataSet(data.nodes.map(n => ({id: n.id, label: n.label || n.id})));
      const edges = new vis.DataSet(data.edges.map(e => ({from: e.from, to: e.to, label: e.relation || ""})));
      new vis.Network(document.getElementById("graph"), {nodes, edges}, {
        physics: { stabilization: false },
        interaction: { hover: true }
      });
    }
    async function loadAnalytics() {
      // Reset first — repeated clicks must not duplicate the tables.
      const el = document.getElementById("analytics");
      el.innerHTML = "Loading...";
      const [cent, comps, pr] = await Promise.all([
        fetch(`${API}/stats/centrality`).then(r => r.json()),
        fetch(`${API}/stats/components`).then(r => r.json()),
        fetch(`${API}/stats/pagerank`).then(r => r.json()),
      ]);

      let html = "<h2>Degree Centrality</h2><table border='1'><tr><th>Node</th><th>In</th><th>Out</th><th>Total</th></tr>";
      for (const [nid, d] of Object.entries(cent).sort((a, b) => b[1].total - a[1].total)) {
        html += `<tr><td>${escapeHtml(nid)}</td><td>${d.in}</td><td>${d.out}</td><td>${d.total}</td></tr>`;
      }
      html += "</table>";

      html += `<h2>Connected Components (${comps.length})</h2>`;
      for (const comp of comps) {
        html += `<div class="result">${comp.length} nodes: ${comp.map(escapeHtml).join(", ")}</div>`;
      }

      html += "<h2>PageRank (top 10)</h2><table border='1'><tr><th>Node</th><th>Score</th></tr>";
      const sortedPr = Object.entries(pr).sort((a, b) => b[1] - a[1]).slice(0, 10);
      for (const [nid, score] of sortedPr) {
        html += `<tr><td>${escapeHtml(nid)}</td><td>${score.toFixed(4)}</td></tr>`;
      }
      html += "</table>";

      el.innerHTML = html;
    }
  </script>
</body>
</html>
