name: KROFT_OS CI (dormant)

# Dormant configuration — no git remote exists (LAW K5: git push forbidden).
# Activates automatically when a remote is added (e.g. GitHub Actions).
# Mirrors scripts/ci.py locally. Non-blocking stages: lint, coverage.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  architecture-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
          pip install ruff || true
      - name: Import check
        run: python -c "import kernel,runtime,contracts,composition,services,adapters,infrastructure,policies,cli,plugins"
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Architecture Gate
        run: python -m pytest tests/test_architecture.py tests/test_architecture_negative.py -q
      - name: AKB Lint
        run: python tools/akb_lint.py
      - name: Lint (non-blocking)
        run: python -m ruff check . || true
