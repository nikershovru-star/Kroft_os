- id: ADR-086
  title: Node discovery + multi-hop routing (ТЗ-NET-ROUTE-01)
  status: accepted
  date: 2026-08-05
  summary: >-
    Масштабируемость Network Layer: узлы обнаруживают друг друга (gossip membership,
    reuse INodeDiscovery/GossipNodeDiscovery) и маршрутизируют dispatch/soft-layer-обмен
    через промежуточные узлы (IRoutingTable.next_hop) до не-прямого пира.
  decision: >-
    K5: INodeDiscovery + GossipNodeDiscovery + IClusterRegistry + CrdtClusterRegistry +
    INetworkTransport уже существуют (TZ-015/ADR-044) -> переиспользуются. НОВЫЙ порт
    IRoutingTable (next_hop) создан (не существовал). FED-конверты расширены RoutingHeader
    (target+ttl); envelope форвардится с СОХРАНЕНИЕМ оригинальной подписи (provenance
    end-to-end). ReferenceRoutingTable = deterministic distance-vector-lite: next_hop возвращает
    direct-peer, делающий максимальный forward-progress к target (loop-free в connected-графе).
    Loop-safety: per-node seen-set + progress-only next_hop (НЕ ttl-мутация, иначе ломается
    оригинальная подпись).
  consequences:
  - Network Layer масштабируем (point-to-point -> multi-hop mesh).
  - verify-before-trust + replay-guard сохранены на каждом hop (CRYPTO-01/HARDEN-01).
  - trust эволюционирует из verified+non-replay исхода удалённого узла (через посредника).
  evidence_level: V
  addresses:
  - TZ-NET-ROUTE-01

- id: ADR-087
  title: Runnable launch + persistence + optional local LLM (ТЗ-LIVE-01)
  status: accepted
  date: 2026-08-05
  summary: >-
    Ядро deterministic + self-evolving, но опыт in-memory терялся между перезапусками.
    ТЗ-LIVE-01: JsonMemoryStore (stdlib json) персистит SOFT-слой (episodes/semantic/
    normative + skills + trust); run_evolution.py строит ядро (+ опц. Ollama-advisor),
    грузит/реплеит состояние, гоняет поток целей, печатает эволюцию, сохраняет. Опц.
    локальный LLM skip-if-unavailable. Ядро эволюционирует между перезапусками.
  evidence_level: V
  addresses:
  - TZ-LIVE-01

- id: ADR-088
  title: Living core — background autosave, SIGINT graceful shutdown, live mode (ТЗ-LIVE-01 extended)
  status: accepted
  date: 2026-08-05
  summary: >-
    ТЗ-LIVE-01 (ADR-087) дал persistence + launch, но ядро стартовало и останавливалось
    после N тиков. Расширение делает его живой системой: --state-dir (./kroft_state),

    --llm {auto,none} (auto = detect_local_ollama -> build_llm_client, none = LLM-free),

    --ticks 0 = live/forever (блок до SIGINT), фоновый autosave-таймер (threading.Timer,

    --autosave-sec default 30), опц. bg-consolidate (выкл по умолчанию), graceful SIGINT

    (save+stop+exit 0). Ядро можно запустить и не выключать; состояние накапливается

    между перезапусками (resume через JsonMemoryStore). K5: переиспользованы JsonMemoryStore,

    build_kernel, detect_local_ollama/build_llm_client, ReferenceExecutor, ReferenceTrustRegistry;

    НОВЫХ портов нет. K1/K6: composition-root + stdlib threading/signal.
  evidence_level: V
  addresses:
  - TZ-LIVE-01

- id: ADR-089
  title: OmniRouter — multi-provider LLM routing with auto-select + fallback (ТЗ-OMNI-01)
  status: accepted
  date: 2026-08-05
  summary: >-
    ТЗ-LLM-LIVE-01 дал один Ollama-эндпоинт. ТЗ-OMNI-01 расширяет до упорядоченного списка

    провайдеров: IModelRouter(ILlm) (contracts/i_model_router.py) + OmniRouter(composition/).

    complete() перебирает OpenAiCompatibleClient по priority, fallback на LLMError/LLMTimeout,

    все сбои -> LLMError (retrieval-only, LLM-01). Локальный Ollama первым (detect_local_ollama,

    priority -100); облачные только при наличии api_key_env. build_llm_client(providers=...)

    возвращает OmniRouter. K5: переиспользованы HttpTransport/OpenAiCompatibleClient/

    detect_local_ollama/build_llm_client/adapter_for; НЕ дублирован adapters/router.py. K6:

    composition->adapters (gate rule); домен без SDK; сеть через IHttpTransport. I-09:

    детерминированный priority-порядок.
  evidence_level: V
  addresses:
  - TZ-OMNI-01

- id: ADR-090
  title: Agent Loop — iterative goal-driven agent cycle over the kernel (ТЗ-AGENT-LOOP-01)
  status: accepted
  date: 2026-08-05
  summary: >-
    Текущий агент = один tick. ТЗ-AGENT-LOOP-01 добавляет итеративный goal-driven цикл

    (Цель->План->Действие->Наблюдение->Рефлексия->Обновление памяти->Следующий шаг) с

    observation-feedback и budget-limit. K5: IAgentPlatform.run (ADR-014) — single-shot mission

    (нет budget/feedback); IAgentExecutor.execute (ADR-080) — один tick; НИ ОДИН НЕ loop ->

    IAgentLoop НОВЫЙ шов (НЕ дублирует IAgentPlatform/IAgentExecutor/ILlm). AgentLoop

    (kernel/agent_loop.py) итерирует build_kernel + kernel.tick; intent.text несёт prior

    observations (feedback); stop на budget ИЛИ отсутствии плана; LLM-free (I-09). AgentLoopResult

    (frozen VO): success, steps_taken, final_outcome, memory_delta. LoopAgentExecutor(IAgentExecutor)

    обёртывает AgentLoop; ReferenceAgentExecutor (single-tick) неизменён (backward-compat).

    O1: failure -> AgentLoopResult(success=False), не crash.
  evidence_level: V
  addresses:
  - TZ-AGENT-LOOP-01

- id: ADR-091
  title: Knowledge Engine — document ingestion -> knowledge extraction -> graph (ТЗ-KNOWLEDGE-ENGINE-01)
  status: accepted
  date: 2026-08-05
  summary: >-
    Граф/SEARCH/RESEARCH есть, но нет ingestion-слоя. ТЗ-KNOWLEDGE-ENGINE-01 даёт Knowledge

    Engine: read -> extract -> link -> update graph -> backlinks. K5: contracts/i_knowledge.py

    УЖЕ имеет IEntityExtractor/IKnowledgeGraph + Entity/Relation/Hypothesis/Fact/IngestReport;

    knowledge_graph УЖЕ имеет IGraphEngine + Node/Edge. НЕТ IKnowledgeEngine/KnowledgeExtraction ->

    НОВЫЙ шов (НЕ дублирует i_knowledge.py). KnowledgeEngine (services/knowledge_engine.py, K6:

    services->contracts; graph+content_index+extractor инъектируются) извлекает entities (# headers

    + [[wikilink]]) и relations (REFERENCES + BACKLINKS), LLM-free детерминизм (I-09 regex), опц.

    LLM-advisor (IEntityExtractor) non-blocking; facts из relations; идемпотентен (get_node check +

    idempotent add_edge). Obsidian-источник (stdlib file-read, БЕЗ SDK) в composition/

    knowledge_engine_factory.py. O1: малформированный doc -> пустая extraction. enum расширен:

    NodeType.NOTE, EdgeType.BACKLINKS.
  evidence_level: V
  addresses:
  - TZ-KNOWLEDGE-ENGINE-01
