# KROFT OS — Allowed Patterns (PL1-PL10)
# Соответствует pattern_library.yaml (AKB root). Reference для арх-gate (allowlist).
# Восстановлено 2026-08-01 по memory + pattern_library.yaml.
allowed:
  - id: PL1
    name: Supervisor
    when: "Component may fail; needs restart/escalation."
    ports: [IComponentController]
    laws: [K1, K3, K8]
  - id: PL2
    name: Plugin
    when: "Extend system without modifying core."
    ports: [IPlugin, IManifest]
    laws: [K3, K8]
  - id: PL3
    name: Repository
    when: "Abstract persistence behind interface."
    ports: [IRepository]
    laws: [K1, K2]
  - id: PL4
    name: Actor
    when: "Concurrent isolated unit of work."
    ports: [IActor]
    laws: [K1, K8]
  - id: PL5
    name: Pipeline
    when: "Sequential stage processing."
    ports: [IPipeline, IStage]
    laws: [K3]
  - id: PL6
    name: Recovery
    when: "Component crash needs automatic heal."
    ports: [IRecoveryPolicy, IReconciler]
    laws: [K1, K8]
  - id: PL7
    name: Scheduler
    when: "Timed/periodic execution."
    ports: [IScheduler]
    laws: [K1, K3]
  - id: PL8
    name: Workflow
    when: "Multi-step orchestration."
    ports: [IPlanner, IExecutor, IReflection]
    laws: [K3, K4]
  - id: PL9
    name: Memory
    when: "Stateful recall."
    ports: [IMemoryStore, ISemanticMemory]
    laws: [K1, K2]
  - id: PL10
    name: Research Mesh
    when: "Distributed research/synthesis via agents."
    ports: [IAgentPlatform]
    laws: [K4, K5, K8]
