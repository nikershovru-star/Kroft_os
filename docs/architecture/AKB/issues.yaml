issues:
- id: WP14-RACE
  title: WP-14 leader/follower broadcast race on wall-clock timing
  severity: medium
  status: closed
  introduced_by: latent pre-fix; surfaced by test-infra fix (eager imports, pytest.ini)
  discovered: '2026-08-02'
  root_cause: 'test_failover_leader_broadcasts_to_follower relies on wall-clock sleeps (0.5s / 0.3s) + RaftLiteElector timers
    (heartbeat 0.05s, election_timeout 0.15s) under multithreaded EventBus. Under CI load the follower may not apply the replicated
    op before the assertion, causing a flaky failure.

    '
  impact: Full-suite run was red (1 failed) after infra fix exposed the latent race.
  resolution_options:
  - xfail(strict=False) + this ticket (honest green, no logic change) — CHOSEN
  - determinize broadcast via logical clock / barrier instead of wall-clock sleep
  notes: 'NOT caused by Cognitive Kernel foundation (test does not import kernel.cognitive_kernel). The test-infra fix (conftest
    eager import + pytest.ini testpaths) changed init ordering/timing, making the race visible.

    '
  related:
  - ADR-043
  - WP-14
  - commit-8832f1d
  resolution: 'ТЗ-NW-01 commit 1: determinize via RaftLiteElector.wait_leader / CrdtGraphEngine.wait_node barriers (threading.Event,
    wake on election event, NOT wall-clock sleep). xfail снят. KNOWN LIMITATION (FLAG 2, ADR-061): RaftLiteElector is simplified
    Raft — no self-election in 2-node pair, symmetric start -> split-brain; use 3+ nodes or assert ''exactly one leader''.'
  closed_by: ТЗ-NW-01 commit 1 (4644d72)
