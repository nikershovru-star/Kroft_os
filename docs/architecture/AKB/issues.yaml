- id: CAUSAL-SEQ-LIMIT
  title: 'CausalMark per-node seq across nodes (gate C.2 / ТЗ-CAUSAL-01)'
  severity: high
  status: closed
  discovered: '2026-08-02'
  root_cause: >-
    Интеграционный срез (commit c610da8) выявил: CausalMark.ordering семантически
    некорректен для реальной федерации — per-node seq сравнивался ACROSS nodes,
    подменяя causal order на «кто больше операций сделал» (talkative node wins).
    Без receive-обновления Lamport вырождается в обычный counter — тот же баг.
  resolution: >-
    ТЗ-CAUSAL-01: CausalMark заменён на Lamport logical clock (CausalMark.lamport +
    node_origin tiebreak), методы tick()/receive(). merge_remote и InMemoryWorldState.update
    делают receive при получении удалённого факта (clock = max(local, received) + 1);
    локальные события (tick/emit) делают tick(). Stored fact marks сохраняют remote origin
    для конвергентности. Idempotent replay: clock растёт только при causally-newer mark.
    Commits 65a3ee2 (contract) + 3724248 (tests). 13/13 ad-hoc PASS, 19 causal-тестов PASS.
  related:
  - ADR-054
  - ADR-055
  - TZ-CAUSAL-01
  - gate-C.2
- id: RE-01-GAP-CLOSED
  title: 'ТЗ-RE-01 W2-gap: Reasoning Engine + world-aware Decision + single node clock'
  severity: info
  status: closed
  introduced_by: архитектурное ревью (флаг 4) — dedicated Reasoning Engine отсутствовал как компонент
  discovered: '2026-08-02'
  root_cause: 'В FSM была только фаза Deliberate (Reasoning->Planning->Decision в общем виде).
    Reasoning не параметризовался Intent и не читал WorldState; IDecisionEngine.select
    не видел WorldState (bind()-хак); три независимых Lamport-clock с хардкодом
    node_origin="kernel" ломали causal order + federation tiebreak.'
  impact: 'Закрыто ТЗ-RE-01 в 6 атомарных коммитах (clock/reasoning/decision/wire/tests/docs).'
  resolution_options:
  - IReasoningEngine.reason(intent, world, attention_context, budget) -> ReasoningStep[] (LLM-free reference)
  - IDecisionEngine.select(goal, candidates, values, world, intent) — world-aware через порт
  - NodeLamportClock единый на узел, инжект в kernel+world+federation; node_origin=node_id
  - wire-ключ "seq"->"lamport"
  notes: 'Коммиты 47d96bd, 4ac6ce5, 0f86b9f, 1a66633, cd525df, docs(ADR-056).
    Full suite 1010 passed, gate 14/14, akb-lint PASSED.'
  related:
  - ADR-054
  - ADR-055
  - ADR-056
  - TZ-RE-01
  - FLAG1
  - FLAGD
  - FLAG3
  - WM-01-GAP-CLOSED
- id: PL-01-GAP-CLOSED
  title: 'ТЗ-PL-01: Autonomous Planner — value-aware lookahead поверх WorldModel'
  severity: info
  status: closed
  introduced_by: 'раунд 1 (Deliberate: Planning phase) / ТЗ-PL-01'
  closed_by: 'ТЗ-PL-01 (ReferencePlanner + value-aware evaluate)'
  addresses:
  - TZ-PL-01
  - FLAG2
  - FLAG3
  evidence:
    contracts: contracts/i_planner.py (IPlanner)
    impl: kernel/planning.py (ReferencePlanner)
    integration: kernel/cognitive_kernel.py (planner.plan в tick)
    tests: tests/test_autonomous_planner.py (+9), tests/test_world_model.py (+3 value-aware)
  note: >
    Planning больше не lambda-stub в build_kernel. Planner РАНЖИРУЕТ по predicted
    value-aware utility (WorldModel.simulate + evaluate с values); Decision ВЫБИРАЕТ.
    Флаг 2 (evaluate мёртвый параметр) закрыт: hard violation -> utility 0 (veto),
    soft utility re-ranks. Флаг 3: relevance по action effect, не carry-over.

- id: WM-01-GAP-CLOSED
  title: 'ТЗ-WM-01: World Model — предиктивная модель поверх WorldState'
  severity: info
  status: closed
  introduced_by: раунд 1 (World State vs World Model); Reasoning Engine (ADR-056) был token-overlap заглушкой
  discovered: '2026-08-02'
  root_cause: 'Reasoning ранжировал candidates по совпадению слов, не по predicted utility.
    World Model отсутствовал как компонент. Residual flag A: дефолтный clock брал
    node_id="kernel".'
  impact: 'Закрыто ТЗ-WM-01 в 6 атомарных коммитах (flag-A fix / контракт / impl / интеграция / тесты / docs).'
  resolution_options:
  - IWorldModel.predict/simulate/evaluate (contracts/i_world_model.py)
  - PredictedState (frozen, horizon + projected_facts + ConfidenceScore + CausalMark)
  - ReferenceWorldModel (LLM-free; confidence падает с horizon; no-fact = low)
  - ReferenceReasoningEngine принимает world_model -> confidence = predicted utility
  - flag A: default clock из world.snapshot().node_id; sentinel-origin normalize в publish
  notes: 'Коммиты b0523d6, f26eb7e, 07d7730, 66043a4, f33c5fc, docs(ADR-057).
    Full suite 1020 passed, gate 14/14, akb-lint PASSED.'
  related:
  - ADR-047
  - ADR-056
  - ADR-057
  - TZ-WM-01
  - FLAGA
