# Golden retrieval-evaluation dataset for the 84 P0 Knowledge Nodes.
# Evaluation layer ONLY — does NOT modify the 84 nodes, runtime, contracts,
# storage, GraphQueryEngine or ContentIndex.
#
# Query authoring rules (Этап 5):
#  - queries are NATURAL user phrasings, NOT copies of node.question
#  - paraphrase / indirect categories intentionally use words that may NOT
#    appear verbatim in the target node (to test real retrieval, not string match)
#  - negative queries have NO correct node among the 84
#
# category: direct|conceptual|practical|troubleshooting|comparison|indirect
# difficulty: easy|medium|hard

